  <rect x="16" y="276" width="240.79999999999998" height="74" rx="18" fill="#E2E8F0"/>
  <text x="30" y="300" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">¿Me la pasás? Me quedé en el</text>
  <text x="30" y="322" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">ejercicio 4</text>
