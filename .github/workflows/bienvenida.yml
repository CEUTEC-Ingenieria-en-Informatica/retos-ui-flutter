name: Bienvenida

# Saluda a quien abre su primer issue o pull request en este repo.
# Usa pull_request_target para poder comentar en PRs que vienen de forks,
# pero no descarga ni ejecuta código del PR: solo deja un comentario.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      # actions/first-interaction v3.1.0, fijada por commit
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d
        with:
          issue_message: |
            ¡Gracias por tu primer issue en la comunidad!

            Si es un error en el material, decinos el archivo y qué esperabas ver. Si es una duda, contá qué intentaste y pegá el error. Te respondemos aquí mismo.
          pr_message: |
            ¡Gracias por tu primer pull request!

            Así sigue:
            1. Revisá que el check salga en verde. Si sale rojo, abrí el detalle para ver qué falló.
            2. Alguien de la comunidad revisa tu cambio y te puede pedir ajustes en los comentarios.
            3. Cuando esté aprobado se une al repo y tu nombre queda en el historial.

            Cualquier duda, preguntá aquí mismo.
